services:

  # ---------------------------------------------------------------------------
  # Corporate structure pipeline
  # ---------------------------------------------------------------------------
  orchestrator:
    image: ${ORCHESTRATOR_IMAGE:-ghcr.io/dsi-clinic/idi-corporate-structure-orchestrator:latest}
    container_name: idi-corporate-structure-orchestrator

    environment:
      # SEC data is read from S3, so AWS credentials are required (an instance
      # role on EC2, or pass keys through locally).
      - AWS_REGION=${AWS_REGION:-us-east-2}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-nano}
      # bucket-name/prefix where the sec-scraper wrote SEC data + manifest.parquet
      - SEC_BUCKET_PREFIX=${SEC_BUCKET_PREFIX:?SEC_BUCKET_PREFIX is required (e.g. my-bucket/sec)}
      - SEC_USER_AGENT=${SEC_USER_AGENT:?SEC_USER_AGENT is required (SEC EDGAR contact string)}
      - OUTPUT_FILE=${OUTPUT_FILE:-/data/output/latest.parquet}
      - FAILURE_FILE=${FAILURE_FILE:-/data/failures/failures.json}
      - RATE_LIMIT=${RATE_LIMIT:-0.2}
      - NUM_WORKERS=${NUM_WORKERS:-10}
      - CLOUDWATCH_LOGS_ENABLED=${CLOUDWATCH_LOGS_ENABLED:-false}
      - INPUT_SAMPLE_SIZE=${INPUT_SAMPLE_SIZE:-0}

    volumes:
      - ${OUTPUT_MOUNT_SOURCE:?OUTPUT_MOUNT_SOURCE is required (host directory for output files)}:/data/output
      - ${FAILURE_MOUNT_SOURCE:?FAILURE_MOUNT_SOURCE is required (host directory for failure files)}:/data/failures
      - ${LOG_DIR:?LOG_DIR is required (host directory for log files)}:/logs

    entrypoint: ["/bin/sh", "-c"]
    # --daily mirrors the scheduled cloud run. OPENAI_API_KEY / OPENAI_MODEL /
    # SEC_USER_AGENT are read from the environment above by the orchestrator, so
    # they are not passed on the command line. For a specific range instead of
    # --daily, run the module directly with --start-date/--end-date.
    command: >
      "python -m idi_corporate_structure.orchestrator
      --sec-bucket-prefix $${SEC_BUCKET_PREFIX}
      --output-file $${OUTPUT_FILE}
      --failure-file $${FAILURE_FILE}
      --daily
      --rate-limit $${RATE_LIMIT}
      --num-workers $${NUM_WORKERS}
      2>&1 | tee /logs/orchestrator_$(date +%Y%m%d_%H%M%S).log"

    # Retry up to 3 times if the process exits with a non-zero code
    restart: on-failure

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
